# Yarn 4, matching the official Desktop outer layer (see
# dsh-desktop-source/.yarnrc.yml). The Shell packages this repository's output
# through the pinned official app-builder-lib TraversalNodeModulesCollector,
# which walks a physical node_modules tree; a symlinked layout breaks it, so
# node-modules is mandatory. Build scripts stay disabled and only the audited
# exceptions in dependenciesMeta are allowed to run.
nodeLinker: node-modules
enableScripts: false
